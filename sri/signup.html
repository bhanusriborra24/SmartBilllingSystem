<!DOCTYPE html>
<html>
<head>
    <title>SignUp</title>
</head>
<style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(135deg,#C9D6FF,#E2E2E2);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            background: linear-gradient(135deg,#FFD194,#FF6A88);
            padding:30px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
            width:600px;
        }

        h2{
            text-align:center;
            color: crimson;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        td{
            padding:12px;
            vertical-align:top;
            color: crimson;
        }

        td:first-child{
            font-weight:bold;
            color: crimson;
            width:35%;
        }

        input[type=text],
        input[type=password],
        input[type=email],
        input[type=tel],
        input[type=date],
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            color: crimson;
            border-radius:6px;
            outline:none;
            transition:0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus{
            border-color:#4CAF50;
            box-shadow:0 0 5px rgba(76,175,80,0.5);
        }

        textarea{
            resize:vertical;
        }

        input[type=radio],
        input[type=checkbox]{
            margin-right:5px;
            margin-left:8px;
        }

        input[type=submit],
        input[type=reset]{
            background:#4CAF50;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
            margin:5px;
            transition:0.3s;
        }

        input[type=reset]{
            background:#f44336;
        }

        input[type=submit]:hover{
            background:#388E3C;
        }

        input[type=reset]:hover{
            background:#d32f2f;
        }
    </style>
<body>
<div class="container">
<center>
<h2>
    <br>
    Registration Form<br><br>
</h2>

<form action="signup.jsp" method="post">

<table border="1" cellpadding="10" cellspacing="0" width=100%>

    <tr>
    <td>Username</td>
    <td><input type="text" name="username" required></td>
</tr>

<tr>
    <td>Password</td>
    <td><input type="password" name="password" required></td>
</tr>

<tr>
    <td>Confirm Password</td>
    <td><input type="password" name="confirmpassword" required></td>
</tr>


<tr>
    <td>Role</td>
    <td>
        <select name="role">
            <option></option>
            <option>Student</option>
            <option>Employee</option>
            <option>Admin</option>
            <option>User</option>
        </select>
    </td>
</tr>

<tr>
    <td>First Name</td>
    <td><input type="text" name="firstname" required></td>
</tr>

<tr>
    <td>Last Name</td>
    <td><input type="text" name="lastname" required></td>
</tr>

<tr>
    <td>Address</td>
    <td>
        <textarea name="address" rows="4" cols="30"></textarea>
    </td>
</tr>

<tr>
    <td>Mobile Number</td>
    <td><input type="tel" name="mobile" pattern="[0-9]{10}" required></td>
</tr>

<tr>
    <td>Email ID</td>
    <td><input type="email" name="email" required></td>
</tr>

<tr>
    <td>Alternative Email ID</td>
    <td><input type="email" name="altemail"></td>
</tr>

<tr>
    <td>Gender</td>
    <td>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Other">Other
    </td>
</tr>

<tr>
    <td>Hobbies</td>
    <td>
        <input type="checkbox" name="hobbies" value="Reading">Reading
        <input type="checkbox" name="hobbies" value="Music">Music<br>
        <input type="checkbox" name="hobbies" value="Sports">Sports
        <input type="checkbox" name="hobbies" value="Travel">Travel<br>
        <input type="checkbox" name="hobbies" value="Travel">Dance
        <input type="checkbox" name="hobbies" value="Travel">Writing Stories
    </td>
</tr>

<tr>
    <td>Date of Birth</td>
    <td><input type="date" name="dob"></td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </td>
</tr>

</table>

</form>
</div>

</center>

</body>
</html>
