<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Supermarket Billing System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background-image:url("indeximg.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Login Box */

.welcome-box{
    position:absolute;
    top:70%;
    left:31%;
    width:450px;
    padding:35px;
    background:transparent;
    border:none;
    box-shadow:none;
}
/* Heading */

.welcome-box h1{
    text-align:center;
    color:white;
    font-size:50px;

}
 
.welcome-box p{
    text-align:center;
    color:white;
    font-size:50px;
}

/* Login Button */

button{
    width:100%;
    padding:12px;
    background:#2E8B57;
    color:white;
    border:none;
    height: 10vh;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
     margin-top:10px;
}

button:hover{
    background:#1d6b43;
}
</style>
</head>

<body>
<div class="welcome-box">
    <a href="admin.jsp">
    <button type="button">WELCOME</button>
</a>
</div>
</body>
</html>
